server {
    listen 80;
    server_name _;
    root /data/public;

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # React（SPA）を /app/ で配信する。
    # ビルド成果物は frontend の `npm run build` が src/public/app に出す。
    #
    # 最後の /app/index.html はフォールバック。
    # 「見つからなければ index.html を返す」のが SPA の作法で、
    # 画面遷移をブラウザ側のルーターに任せられる（今は使っていないが、
    # react-router を入れた時に直リンクやリロードが 404 にならない）。
    location /app/ {
        # サーバー全体の index は index.php だが、React 側は index.html なので
        # このブロックの中だけ上書きする（無いと /app/ が 403 になる）。
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    # /app（末尾スラッシュ無し）で来ても開けるようにする
    location = /app {
        return 301 /app/;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}